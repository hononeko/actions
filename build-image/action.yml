name: Build image
description: >-
  Builds a container image with Docker Buildx, defaulting org.opencontainers.image.source to the repository URL.
  When `push` is true, pushes the image by digest with provenance and an SBOM; otherwise loads it into Docker for
  smoke testing. With `cache-scope`, reads that GitHub Actions cache and exports to it except on pull requests. Set
  up Buildx (and log in to the registry when `push` is true) first.

inputs:
  image:
    description: Image to push by digest when `push` is true, e.g. ghcr.io/owner/name
    required: false
    default: ""
  context:
    description: Build context path
    required: false
    default: .
  file:
    description: Path to the Dockerfile, relative to the workspace; empty for Buildx's default
    required: false
    default: ""
  platforms:
    description: Target platform(s), e.g. linux/amd64
    required: false
    default: ""
  push:
    description: >-
      "true" to push by digest with provenance and SBOM; "false" to load into the local Docker daemon under `tags`
    required: false
    default: "false"
  tags:
    description: Tags to apply when loading into the local Docker daemon (`push` is false)
    required: false
    default: ""
  build-args:
    description: Build-time variables, one KEY=VALUE per line
    required: false
    default: ""
  labels:
    description: Extra image labels, one KEY=VALUE per line (appended after org.opencontainers.image.source)
    required: false
    default: ""
  cache-scope:
    description: >-
      GitHub Actions cache scope to read layers from and export them to (mode=max), e.g. app-amd64; empty for none.
      Use one scope per image and architecture
    required: false
    default: ""
  cache-write:
    description: >-
      Whether to export to `cache-scope`: "auto" exports except on pull_request, pull_request_target and merge_group
      events, whose caches the default branch can't read; "true" or "false" to choose
    required: false
    default: auto
  cache-from:
    description: Extra cache sources, one per line, read before `cache-scope`
    required: false
    default: ""
  cache-to:
    description: Extra cache export destinations, one per line, exported regardless of `cache-write`
    required: false
    default: ""
  provenance:
    description: Provenance attestation mode when `push` is true
    required: false
    default: mode=max
  sbom:
    description: Attach SBOM attestation when `push` is true
    required: false
    default: "true"
  digest-artifact:
    description: >-
      Artifact name to upload the exported digest file under when `push` is true (e.g. digests-amd64) for
      publish-image; empty to skip uploading
    required: false
    default: ""

outputs:
  digest:
    description: Digest of the built image, e.g. sha256:...
    value: ${{ steps.build.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        BUILD_PUSH: ${{ inputs.push }}
        BUILD_IMAGE: ${{ inputs.image }}
        BUILD_SBOM: ${{ inputs.sbom }}
        BUILD_DIGEST_ARTIFACT: ${{ inputs.digest-artifact }}
      run: '"$GITHUB_ACTION_PATH/validate-inputs.sh"'

    - name: Resolve cache
      id: cache
      shell: bash
      env:
        CACHE_SCOPE: ${{ inputs.cache-scope }}
        CACHE_WRITE: ${{ inputs.cache-write }}
        CACHE_FROM: ${{ inputs.cache-from }}
        CACHE_TO: ${{ inputs.cache-to }}
        EVENT_NAME: ${{ github.event_name }}
      run: '"$GITHUB_ACTION_PATH/resolve-cache.sh"'

    - name: Build image
      id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        platforms: ${{ inputs.platforms }}
        outputs: ${{ inputs.push == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', inputs.image) || '' }}
        load: ${{ inputs.push != 'true' }}
        tags: ${{ inputs.push != 'true' && inputs.tags || '' }}
        build-args: ${{ inputs.build-args }}
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          ${{ inputs.labels }}
        cache-from: ${{ steps.cache.outputs.cache-from }}
        cache-to: ${{ steps.cache.outputs.cache-to }}
        provenance: ${{ inputs.push == 'true' && inputs.provenance || 'false' }}
        sbom: ${{ inputs.push == 'true' && inputs.sbom || 'false' }}

    - name: Export digest
      if: inputs.push == 'true' && inputs.digest-artifact != ''
      shell: bash
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
        DIGESTS: ${{ runner.temp }}/build-image-digests
      run: |
        [[ $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]] || {
          echo "::error title=build-image::Expected sha256 digest from build, got '$DIGEST'" >&2
          exit 1
        }
        rm -rf "$DIGESTS"
        mkdir -p "$DIGESTS"
        touch "$DIGESTS/${DIGEST#sha256:}"

    - name: Upload digest
      if: inputs.push == 'true' && inputs.digest-artifact != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: ${{ inputs.digest-artifact }}
        path: ${{ runner.temp }}/build-image-digests/*
        if-no-files-found: error
        retention-days: 1

    - name: Remove digests directory
      if: always() && inputs.push == 'true' && inputs.digest-artifact != ''
      shell: bash
      env:
        DIGESTS: ${{ runner.temp }}/build-image-digests
      run: rm -rf "$DIGESTS"
