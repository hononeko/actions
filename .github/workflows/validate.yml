name: Validate

on:
  workflow_call:

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: ShellCheck
        run: shellcheck release-notes/release-notes.sh tests/*.sh

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 -color

      - name: Release notes tests
        run: tests/release-notes.test.sh

  # Runs both actions the way a consumer would, against this repository's own history.
  actions:
    name: Run the actions
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Version
        id: version
        uses: ./version
        with:
          tag-prefix: v

      - name: Check the version outputs
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_TAG: ${{ steps.version.outputs.version-tag }}
          VERSION_TYPE: ${{ steps.version.outputs.version-type }}
          RC_VERSION: ${{ steps.version.outputs.rc-version }}
          COMMIT_TAG: ${{ steps.version.outputs.commit-tag }}
        run: |
          echo "version=$VERSION tag=$VERSION_TAG type=$VERSION_TYPE rc=$RC_VERSION commit=$COMMIT_TAG"
          [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [ "$VERSION_TAG" = "v$VERSION" ]
          [[ $VERSION_TYPE =~ ^(major|minor|patch|none)$ ]]
          [[ $RC_VERSION =~ ^$VERSION-rc\.[0-9]+$ ]]
          [[ $COMMIT_TAG =~ ^sha-[0-9a-f]{7}$ ]]

      - name: Release notes
        id: notes
        uses: ./release-notes
        with:
          previous-tag: ${{ steps.version.outputs.previous-tag }}
          tag: ${{ steps.version.outputs.version-tag }}

      - name: Check the release notes
        env:
          NOTES: ${{ steps.notes.outputs.path }}
        run: |
          grep -q '^\*\*Full Changelog\*\*: https://github.com/' "$NOTES"

  # The version action against throwaway repositories: each case starts from a v1.2.3 release and adds commits.
  version-rules:
    name: Version rules (${{ matrix.case }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: feat
            subjects: "fix: a fix|feat(ui): a feature"
            expected: 1.3.0 minor
          - case: fix
            subjects: "fix: a fix|chore(deps): an update"
            expected: 1.2.4 patch
          - case: docs and test only
            subjects: "docs: a doc|test: a test"
            expected: 1.2.3 none
          - case: bang
            subjects: "feat(api)!: drop v1"
            expected: 2.0.0 major
          - case: footer
            subjects: "refactor: move it"
            body: "BREAKING CHANGE: it moved"
            expected: 2.0.0 major
          - case: mentioned, not a footer
            subjects: "feat: explain the rules"
            body: "type!: and BREAKING CHANGE: are mentioned here, mid-line."
            expected: 1.3.0 minor
          - case: feat mentioned in a fix
            subjects: "fix: revert the feat: change"
            expected: 1.2.4 patch
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: src

      - name: Create the fixture repository
        env:
          SUBJECTS: ${{ matrix.subjects }}
          BODY: ${{ matrix.body }}
        run: |
          git init -q -b main
          echo src/ >> .git/info/exclude
          git config user.name test
          git config user.email test@example.com
          git commit -q --allow-empty -m "feat: first"
          git tag v1.2.3
          IFS='|' read -ra lines <<<"$SUBJECTS"
          for subject in "${lines[@]}"; do
            if [ -n "$BODY" ]; then git commit -q --allow-empty -m "$subject" -m "$BODY"; else git commit -q --allow-empty -m "$subject"; fi
          done
          git log --format='%h %s%n%b'

      - name: Version
        id: version
        uses: ./src/version
        with:
          tag-prefix: v

      - name: Check the version
        env:
          ACTUAL: ${{ steps.version.outputs.version }} ${{ steps.version.outputs.version-type }}
          EXPECTED: ${{ matrix.expected }}
        run: |
          echo "expected $EXPECTED, got $ACTUAL"
          [ "$ACTUAL" = "$EXPECTED" ]
