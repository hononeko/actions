name: Validate

on:
  workflow_call:

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: ShellCheck
        run: >-
          shellcheck release-notes/release-notes.sh smoke-test/smoke-test.sh bun-setup/resolve-version.sh
          gradle-setup/*.sh publish-image/*.sh prune-snapshots/*.sh release-candidate/*.sh coverage/*.sh lint-*/*.sh tests/*.sh

      # actionlint only reads an action's metadata where a workflow here uses it, so every action.yml is checked too:
      # a YAML error in one only shows up when a consumer loads it.
      - name: Action metadata
        run: |
          for f in */action.yml; do
            yq -e '.name and .description and .runs.using == "composite"' "$f" >/dev/null || { echo "::error file=$f::Invalid action metadata"; exit 1; }
            echo "ok $f"
          done

      # actionlint and zizmor, through this repository's own lint-actions.
      - name: Lint workflows and actions
        uses: ./lint-actions

      - name: Release notes tests
        run: tests/release-notes.test.sh

      - name: Bun version resolution tests
        run: tests/bun-setup.test.sh

      - name: JDK and Gradle version resolution tests
        run: tests/gradle-setup.test.sh

      - name: Publish image tests
        run: tests/publish-image.test.sh

      - name: Snapshot pattern tests
        run: tests/snapshot-pattern.test.sh

      - name: Smoke test script tests
        run: tests/smoke-test.test.sh

      - name: Coverage tests
        run: tests/coverage.test.sh

      - name: Lint annotation tests
        run: tests/lint-annotations.test.sh

      - name: detekt checksum tests
        run: tests/lint-kotlin.test.sh

      - name: Release candidate tests
        run: tests/release-candidate.test.sh

      # ghcr-cleanup-action refuses any delete-tags regex that safe-regex2 flags, at the version in its package.json.
      # zizmor's adhoc-packages is ignored: the version is pinned and its install scripts don't run.
      - name: Snapshot pattern passes the cleanup action's regex check
        run: | # zizmor: ignore[adhoc-packages]
          npm install --no-save --ignore-scripts --silent safe-regex2@5.1.1
          for pr in 1 42 99999; do
            pattern=$(prune-snapshots/snapshot-pattern.sh "$pr")
            PATTERN=$pattern node -e 'process.exit(require("safe-regex2")(process.env.PATTERN) ? 0 : 1)' ||
              { echo "::error::safe-regex2 rejects $pattern"; exit 1; }
            echo "ok $pattern"
          done

  # Runs both actions the way a consumer would, against this repository's own history.
  actions:
    name: Run the actions
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Version
        id: version
        uses: ./version
        with:
          tag-prefix: v

      - name: Check the version outputs
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_TAG: ${{ steps.version.outputs.version-tag }}
          VERSION_TYPE: ${{ steps.version.outputs.version-type }}
          RC_VERSION: ${{ steps.version.outputs.rc-version }}
          COMMIT_TAG: ${{ steps.version.outputs.commit-tag }}
        run: |
          echo "version=$VERSION tag=$VERSION_TAG type=$VERSION_TYPE rc=$RC_VERSION commit=$COMMIT_TAG"
          [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [ "$VERSION_TAG" = "v$VERSION" ]
          [[ $VERSION_TYPE =~ ^(major|minor|patch|none)$ ]]
          [[ $RC_VERSION =~ ^$VERSION-rc\.[0-9]+$ ]]
          [[ $COMMIT_TAG =~ ^sha-[0-9a-f]{7}$ ]]

      - name: Release notes
        id: notes
        uses: ./release-notes
        with:
          previous-tag: ${{ steps.version.outputs.previous-tag }}
          tag: ${{ steps.version.outputs.version-tag }}

      - name: Check the release notes
        env:
          NOTES: ${{ steps.notes.outputs.path }}
        run: |
          grep -q '^\*\*Full Changelog\*\*: https://github.com/' "$NOTES"

  # The version action's snapshot outputs, against a throwaway repository: a v1.2.3 release, then a feature.
  snapshot-version:
    name: Snapshot version
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: src

      - name: Create the fixture repository
        id: fixture
        run: |
          git init -q -b main
          echo src/ >> .git/info/exclude
          git config user.name test
          git config user.email test@example.com
          change() { echo "$1" >> changes.txt; git add changes.txt; git commit -q -m "$1"; }
          change "feat: first"
          git tag v1.2.3
          # The major tag every release moves; versions and release notes go by v1.2.3 alone.
          git tag v1
          change "feat: second"
          change "fix: third"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "parent=$(git rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"

      - name: Version
        id: version
        uses: ./src/version
        with:
          tag-prefix: v
          pr-number: "42"
          head-sha: ${{ steps.fixture.outputs.head }}

      - name: Check the snapshot outputs
        env:
          SNAPSHOT_TAG: ${{ steps.version.outputs.snapshot-tag }}
          SNAPSHOT_VERSION: ${{ steps.version.outputs.snapshot-version }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous-tag }}
        run: |
          echo "snapshot-tag=$SNAPSHOT_TAG snapshot-version=$SNAPSHOT_VERSION previous-tag=$PREVIOUS_TAG"
          [ "$PREVIOUS_TAG" = v1.2.3 ]
          [ "$SNAPSHOT_TAG" = "pr-42-sha-$(git rev-parse --short=7 HEAD)" ]
          [ "$SNAPSHOT_VERSION" = 1.3.0-pr.42.2 ]
          # prune-snapshots must find exactly the tags version names.
          grep -Eq "$(src/prune-snapshots/snapshot-pattern.sh 42)" <<<"$SNAPSHOT_TAG"

      - name: Version without a pull request number
        id: plain
        uses: ./src/version
        with:
          tag-prefix: v

      - name: Check there's no snapshot without one
        env:
          SNAPSHOT_TAG: ${{ steps.plain.outputs.snapshot-tag }}
          SNAPSHOT_VERSION: ${{ steps.plain.outputs.snapshot-version }}
        run: |
          [ -z "$SNAPSHOT_TAG$SNAPSHOT_VERSION" ]

      - name: Version with a malformed pull request number
        id: malformed
        continue-on-error: true
        uses: ./src/version
        with:
          tag-prefix: v
          pr-number: "42; true"
          head-sha: ${{ steps.fixture.outputs.head }}

      # Stands in for GitHub's merge commit: HEAD isn't the pull request's head, so naming a snapshot must fail.
      - name: Version of another commit
        id: other
        continue-on-error: true
        uses: ./src/version
        with:
          tag-prefix: v
          pr-number: "42"
          head-sha: ${{ steps.fixture.outputs.parent }}

      - name: Check both failed
        env:
          MALFORMED: ${{ steps.malformed.outcome }}
          OTHER: ${{ steps.other.outcome }}
        run: |
          [ "$MALFORMED" = failure ]
          [ "$OTHER" = failure ]

  # The version action in a repository releasing two images, each from its own directory under its own tag prefix.
  version-per-path:
    name: Version per path
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: src

      - name: Create the fixture repository
        run: |
          git init -q -b main
          echo src/ >> .git/info/exclude
          git config user.name test
          git config user.email test@example.com
          change() { mkdir -p "images/$1"; echo "$2" >> "images/$1/Dockerfile"; git add images; git commit -q -m "$2"; }
          change app-a "feat(app-a): first"
          git tag app-a-1.2.3
          change app-b "feat(app-b): a feature elsewhere"

      - name: Version with only the other image changed
        id: unchanged
        uses: ./src/version
        with:
          tag-prefix: app-a-
          change-path: images/app-a

      - name: Fix the image
        run: |
          echo fix >> images/app-a/Dockerfile
          git add images && git commit -q -m "fix(app-a): a fix"

      - name: Version with the image changed
        id: changed
        uses: ./src/version
        with:
          tag-prefix: app-a-
          change-path: images/app-a

      - name: Check the versions
        env:
          UNCHANGED: ${{ steps.unchanged.outputs.version-type }}
          ACTUAL: >-
            ${{ steps.changed.outputs.version }} ${{ steps.changed.outputs.version-type }}
            ${{ steps.changed.outputs.version-tag }} ${{ steps.changed.outputs.previous-tag }}
            ${{ steps.changed.outputs.rc-version }}
        run: |
          echo "unchanged: $UNCHANGED; changed: $ACTUAL"
          [ "$UNCHANGED" = none ]
          [ "$ACTUAL" = "1.2.4 patch app-a-1.2.4 app-a-1.2.3 1.2.4-rc.1" ]

  # The version action against throwaway repositories: each case starts from a v1.2.3 release and adds commits.
  version-rules:
    name: Version rules (${{ matrix.case }})
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: feat
            subjects: "fix: a fix|feat(ui): a feature"
            expected: 1.3.0 minor
          - case: fix
            subjects: "fix: a fix|chore(deps): an update"
            expected: 1.2.4 patch
          - case: docs and test only
            subjects: "docs: a doc|test: a test"
            expected: 1.2.3 none
          - case: bang
            subjects: "feat(api)!: drop v1"
            expected: 2.0.0 major
          - case: footer
            subjects: "refactor: move it"
            body: "BREAKING CHANGE: it moved"
            expected: 2.0.0 major
          - case: mentioned, not a footer
            subjects: "feat: explain the rules"
            body: "This mentions type!: and BREAKING CHANGE: mid-line."
            expected: 1.3.0 minor
          - case: feat mentioned in a fix
            subjects: "fix: revert the feat: change"
            expected: 1.2.4 patch
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: src

      - name: Create the fixture repository
        env:
          SUBJECTS: ${{ matrix.subjects }}
          BODY: ${{ matrix.body }}
        run: |
          git init -q -b main
          echo src/ >> .git/info/exclude
          git config user.name test
          git config user.email test@example.com
          # semantic-version skips commits that change no files, so each one changes a file.
          change() { echo "$1" >> changes.txt; git add changes.txt; }
          change first
          git commit -q -m "feat: first"
          git tag v1.2.3
          git tag v1
          IFS='|' read -ra lines <<<"$SUBJECTS"
          for subject in "${lines[@]}"; do
            change "$subject"
            if [ -n "$BODY" ]; then git commit -q -m "$subject" -m "$BODY"; else git commit -q -m "$subject"; fi
          done
          git log --format='%h %s%n%b'

      - name: Version
        id: version
        uses: ./src/version
        with:
          tag-prefix: v

      - name: Check the version
        env:
          ACTUAL: ${{ steps.version.outputs.version }} ${{ steps.version.outputs.version-type }}
          EXPECTED: ${{ matrix.expected }}
        run: |
          echo "expected $EXPECTED, got $ACTUAL"
          [ "$ACTUAL" = "$EXPECTED" ]

  smoke-test:
    name: Smoke test action
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Pull a test image
        run: docker pull nginx:1.31-alpine@sha256:785835ea65db4bba6f021acc0f3be91b0fef76a53fe41f8588c6698d2aed0606

      - name: Smoke test an answering image
        uses: ./smoke-test
        with:
          image: nginx:1.31-alpine@sha256:785835ea65db4bba6f021acc0f3be91b0fef76a53fe41f8588c6698d2aed0606
          port: "80"
          status: "200"
          env: |
            FOO=bar

      - name: Smoke test a wrong status
        id: wrong
        continue-on-error: true
        uses: ./smoke-test
        with:
          image: nginx:1.31-alpine@sha256:785835ea65db4bba6f021acc0f3be91b0fef76a53fe41f8588c6698d2aed0606
          port: "80"
          path: /missing
          status: "200"

      - name: Check the wrong status failed
        env:
          OUTCOME: ${{ steps.wrong.outcome }}
        run: |
          [ "$OUTCOME" = "failure" ]

  # Runs the lint actions the way a consumer would, against the fixture projects in tests/fixtures: each passes its
  # clean project, then fails once an issue is added.
  lint:
    name: Lint actions
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Lint Go
        uses: ./lint-go
        with:
          working-directory: tests/fixtures/go-project

      - name: Lint Kotlin
        uses: ./lint-kotlin
        with:
          working-directory: tests/fixtures/kotlin-project

      - name: Lint JS/TS
        uses: ./lint-js
        with:
          working-directory: tests/fixtures/js-project

      - name: Lint Docker
        uses: ./lint-docker
        with:
          dockerfiles: tests/fixtures/docker/Dockerfile

      - name: Add an issue to each project
        run: |
          printf 'package fixture\n\nimport "os"\n\n// Clean removes a file.\nfunc Clean() {\n\tos.Remove("x")\n}\n' \
            > tests/fixtures/go-project/issue.go
          printf 'package fixture\n\nfun empty() {}\n' > tests/fixtures/kotlin-project/src/main/kotlin/fixture/Issue.kt
          printf 'export function stop(): void {\n  debugger;\n}\n' > tests/fixtures/js-project/src/issue.ts
          printf 'FROM alpine:latest\n' > tests/fixtures/docker/Dockerfile.issue

      - name: Lint Go with an unchecked error
        id: go
        continue-on-error: true
        uses: ./lint-go
        with:
          working-directory: tests/fixtures/go-project

      - name: Lint Kotlin with an empty function
        id: kotlin
        continue-on-error: true
        uses: ./lint-kotlin
        with:
          working-directory: tests/fixtures/kotlin-project

      - name: Lint JS/TS with a debugger statement
        id: js
        continue-on-error: true
        uses: ./lint-js
        with:
          working-directory: tests/fixtures/js-project

      - name: Lint Docker with an image on latest
        id: docker
        continue-on-error: true
        uses: ./lint-docker
        with:
          dockerfiles: tests/fixtures/docker/Dockerfile tests/fixtures/docker/Dockerfile.issue

      - name: Check each failed
        env:
          OUTCOMES: ${{ steps.go.outcome }} ${{ steps.kotlin.outcome }} ${{ steps.js.outcome }} ${{ steps.docker.outcome }}
        run: |
          echo "$OUTCOMES"
          [ "$OUTCOMES" = "failure failure failure failure" ]

  # Runs coverage on the Go fixture's tests. On a pull request it also counts the changed lines, from the shallow merge
  # commit actions/checkout makes.
  coverage:
    name: Coverage action
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tests/fixtures/go-project
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: tests/fixtures/go-project/go.mod
          cache: false

      - name: Test with coverage
        run: go test -coverprofile=coverage.out ./...

      - name: Coverage
        id: coverage
        uses: ./coverage
        with:
          files: coverage.out
          working-directory: tests/fixtures/go-project
          min-coverage: "60"
          title: Fixture coverage

      - name: Check the outputs
        env:
          ACTUAL: ${{ steps.coverage.outputs.coverage }} ${{ steps.coverage.outputs.covered }}/${{ steps.coverage.outputs.total }}
          CHANGED_TOTAL: ${{ steps.coverage.outputs.changed-total }}
        run: |
          echo "coverage $ACTUAL, changed lines counted: $CHANGED_TOTAL"
          [ "$ACTUAL" = "66.67 2/3" ]
          [[ $CHANGED_TOTAL =~ ^[0-9]+$ ]]

      - name: Coverage below the minimum
        id: below
        continue-on-error: true
        uses: ./coverage
        with:
          files: coverage.out
          working-directory: tests/fixtures/go-project
          min-coverage: "70"
          title: Fixture coverage, below the minimum

      - name: Check it failed
        env:
          OUTCOME: ${{ steps.below.outcome }}
        run: |
          [ "$OUTCOME" = "failure" ]

  # The release-candidate action finding an image that's already published (tests/release-candidate.test.sh covers waiting
  # for one).
  release-candidate:
    name: Release candidate action
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Find a published image
        id: rc
        uses: ./release-candidate
        with:
          image: nginx
          tag: 1.29-alpine
          version: 1.29

      - name: Check the digest
        env:
          DIGEST: ${{ steps.rc.outputs.digest }}
        run: |
          echo "digest=$DIGEST"
          [[ $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]]

  # Runs bun-setup the way a consumer would, against the fixture projects in tests/fixtures.
  bun-setup:
    name: Bun setup action
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Bun from .bun-version
        id: pinned
        uses: ./bun-setup
        with:
          working-directory: tests/fixtures/bun-project

      - name: Check the pinned setup
        working-directory: tests/fixtures/bun-project
        env:
          BUN_VERSION_OUTPUT: ${{ steps.pinned.outputs.bun-version }}
          CACHE_HIT: ${{ steps.pinned.outputs.cache-hit }}
        run: |
          expected=$(head -n 1 .bun-version)
          echo "bun-version=$BUN_VERSION_OUTPUT cache-hit=$CACHE_HIT"
          [ "$BUN_VERSION_OUTPUT" = "$expected" ]
          [ "$(bun --version)" = "$expected" ]
          [[ $CACHE_HIT =~ ^(true|false)$ ]]
          [ -d node_modules/ms ]
          # Lifecycle scripts are skipped by default
          [ ! -e postinstall-ran ]

      - name: Set up Bun with lifecycle scripts enabled
        uses: ./bun-setup
        with:
          working-directory: tests/fixtures/bun-project
          ignore-scripts: "false"

      - name: Check the postinstall script ran
        run: '[ -e tests/fixtures/bun-project/postinstall-ran ]'

      - name: Set up Bun with an explicit version and no install
        id: explicit
        uses: ./bun-setup
        with:
          bun-version: 1.4.2
          install: "false"

      - name: Check the explicit version
        env:
          BUN_VERSION_OUTPUT: ${{ steps.explicit.outputs.bun-version }}
          CACHE_HIT: ${{ steps.explicit.outputs.cache-hit }}
        run: |
          [ "$BUN_VERSION_OUTPUT" = 1.4.2 ]
          [ "$(bun --version)" = 1.4.2 ]
          [ "$CACHE_HIT" = false ]

      - name: Set up an unpinned project
        id: unpinned
        continue-on-error: true
        uses: ./bun-setup
        with:
          working-directory: tests/fixtures/bun-unpinned
          install: "false"

      - name: Check the unpinned project failed
        env:
          OUTCOME: ${{ steps.unpinned.outcome }}
        run: |
          [ "$OUTCOME" = "failure" ]

  # Runs gradle-setup the way a consumer would, against the fixture projects in tests/fixtures. setup-gradle runs once
  # per job, so each way of pinning the JDK gets its own job.
  gradle-setup:
    name: Gradle setup action (${{ matrix.case }})
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: exact version from .java-version
            java-version: ""
            java-distribution: ""
            expected-distribution: temurin
          - case: feature release and distribution inputs
            java-version: "21"
            java-distribution: zulu
            expected-distribution: zulu
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up an unpinned project
        id: unpinned
        if: matrix.java-version == ''
        continue-on-error: true
        uses: ./gradle-setup
        with:
          working-directory: tests/fixtures/gradle-unpinned

      - name: Check the unpinned project failed
        if: matrix.java-version == ''
        env:
          OUTCOME: ${{ steps.unpinned.outcome }}
        run: |
          [ "$OUTCOME" = "failure" ]

      - name: Set up the JDK and Gradle
        id: setup
        uses: ./gradle-setup
        with:
          java-version: ${{ matrix.java-version }}
          java-distribution: ${{ matrix.java-distribution }}
          working-directory: tests/fixtures/gradle-project

      - name: Check the setup
        working-directory: tests/fixtures/gradle-project
        env:
          INPUT: ${{ matrix.java-version }}
          EXPECTED_DISTRIBUTION: ${{ matrix.expected-distribution }}
          JAVA_VERSION_OUTPUT: ${{ steps.setup.outputs.java-version }}
          JAVA_DISTRIBUTION_OUTPUT: ${{ steps.setup.outputs.java-distribution }}
          JAVA_INSTALLED_OUTPUT: ${{ steps.setup.outputs.java-installed-version }}
          JAVA_HOME_OUTPUT: ${{ steps.setup.outputs.java-home }}
          GRADLE_VERSION_OUTPUT: ${{ steps.setup.outputs.gradle-version }}
        run: |
          expected=${INPUT:-$(head -n 1 .java-version)}
          echo "java-version=$JAVA_VERSION_OUTPUT java-distribution=$JAVA_DISTRIBUTION_OUTPUT" \
            "java-installed-version=$JAVA_INSTALLED_OUTPUT java-home=$JAVA_HOME_OUTPUT gradle-version=$GRADLE_VERSION_OUTPUT"
          [ "$JAVA_VERSION_OUTPUT" = "$expected" ]
          [ "$JAVA_DISTRIBUTION_OUTPUT" = "$EXPECTED_DISTRIBUTION" ]
          [[ $JAVA_INSTALLED_OUTPUT == "$expected"* ]]
          [ "$JAVA_HOME" = "$JAVA_HOME_OUTPUT" ]
          # setup-java installs each distribution under its own tool cache folder: Java_Zulu_jdk, Java_Temurin-Hotspot_jdk
          [[ ${JAVA_HOME_OUTPUT,,} == *"/java_${EXPECTED_DISTRIBUTION}"[_-]* ]]
          grep -q "/gradle-$GRADLE_VERSION_OUTPUT-bin.zip$" gradle/wrapper/gradle-wrapper.properties
          # The build runs on the pinned JDK, with the wrapper's Gradle
          ./gradlew --version | grep -qx "Gradle $GRADLE_VERSION_OUTPUT"
          runtime=$(./gradlew -q printJavaVersion)
          echo "build JVM: $runtime"
          [[ $runtime == "$expected"* ]]
