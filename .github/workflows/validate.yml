name: Validate

on:
  workflow_call:

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: ShellCheck
        run: >-
          shellcheck release-notes/release-notes.sh smoke-test/smoke-test.sh bun-setup/resolve-version.sh
          publish-image/*.sh prune-snapshots/*.sh tests/*.sh

      # actionlint only reads an action's metadata where a workflow here uses it, so every action.yml is checked too:
      # a YAML error in one only shows up when a consumer loads it.
      - name: Action metadata
        run: |
          for f in */action.yml; do
            yq -e '.name and .description and .runs.using == "composite"' "$f" >/dev/null || { echo "::error file=$f::Invalid action metadata"; exit 1; }
            echo "ok $f"
          done

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

      - name: Release notes tests
        run: tests/release-notes.test.sh

      - name: Bun version resolution tests
        run: tests/bun-setup.test.sh

      - name: Publish image tests
        run: tests/publish-image.test.sh

      - name: Snapshot pattern tests
        run: tests/snapshot-pattern.test.sh

  # Runs both actions the way a consumer would, against this repository's own history.
  actions:
    name: Run the actions
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Version
        id: version
        uses: ./version
        with:
          tag-prefix: v

      - name: Check the version outputs
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_TAG: ${{ steps.version.outputs.version-tag }}
          VERSION_TYPE: ${{ steps.version.outputs.version-type }}
          RC_VERSION: ${{ steps.version.outputs.rc-version }}
          COMMIT_TAG: ${{ steps.version.outputs.commit-tag }}
        run: |
          echo "version=$VERSION tag=$VERSION_TAG type=$VERSION_TYPE rc=$RC_VERSION commit=$COMMIT_TAG"
          [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [ "$VERSION_TAG" = "v$VERSION" ]
          [[ $VERSION_TYPE =~ ^(major|minor|patch|none)$ ]]
          [[ $RC_VERSION =~ ^$VERSION-rc\.[0-9]+$ ]]
          [[ $COMMIT_TAG =~ ^sha-[0-9a-f]{7}$ ]]

      - name: Release notes
        id: notes
        uses: ./release-notes
        with:
          previous-tag: ${{ steps.version.outputs.previous-tag }}
          tag: ${{ steps.version.outputs.version-tag }}

      - name: Check the release notes
        env:
          NOTES: ${{ steps.notes.outputs.path }}
        run: |
          grep -q '^\*\*Full Changelog\*\*: https://github.com/' "$NOTES"

  # The version action's snapshot outputs, against a throwaway repository: a v1.2.3 release, then a feature.
  snapshot-version:
    name: Snapshot version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: src

      - name: Create the fixture repository
        id: fixture
        run: |
          git init -q -b main
          echo src/ >> .git/info/exclude
          git config user.name test
          git config user.email test@example.com
          change() { echo "$1" >> changes.txt; git add changes.txt; git commit -q -m "$1"; }
          change "feat: first"
          git tag v1.2.3
          change "feat: second"
          change "fix: third"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "parent=$(git rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"

      - name: Version
        id: version
        uses: ./src/version
        with:
          tag-prefix: v
          pr-number: "42"
          head-sha: ${{ steps.fixture.outputs.head }}

      - name: Check the snapshot outputs
        env:
          SNAPSHOT_TAG: ${{ steps.version.outputs.snapshot-tag }}
          SNAPSHOT_VERSION: ${{ steps.version.outputs.snapshot-version }}
        run: |
          echo "snapshot-tag=$SNAPSHOT_TAG snapshot-version=$SNAPSHOT_VERSION"
          [ "$SNAPSHOT_TAG" = "pr-42-sha-$(git rev-parse --short=7 HEAD)" ]
          [ "$SNAPSHOT_VERSION" = 1.3.0-pr.42.2 ]
          # prune-snapshots must find exactly the tags version names.
          grep -Eq "$(src/prune-snapshots/snapshot-pattern.sh 42)" <<<"$SNAPSHOT_TAG"

      - name: Version without a pull request number
        id: plain
        uses: ./src/version
        with:
          tag-prefix: v

      - name: Check there's no snapshot without one
        env:
          SNAPSHOT_TAG: ${{ steps.plain.outputs.snapshot-tag }}
          SNAPSHOT_VERSION: ${{ steps.plain.outputs.snapshot-version }}
        run: |
          [ -z "$SNAPSHOT_TAG$SNAPSHOT_VERSION" ]

      - name: Version with a malformed pull request number
        id: malformed
        continue-on-error: true
        uses: ./src/version
        with:
          tag-prefix: v
          pr-number: "42; true"
          head-sha: ${{ steps.fixture.outputs.head }}

      # Stands in for GitHub's merge commit: HEAD isn't the pull request's head, so naming a snapshot must fail.
      - name: Version of another commit
        id: other
        continue-on-error: true
        uses: ./src/version
        with:
          tag-prefix: v
          pr-number: "42"
          head-sha: ${{ steps.fixture.outputs.parent }}

      - name: Check both failed
        env:
          MALFORMED: ${{ steps.malformed.outcome }}
          OTHER: ${{ steps.other.outcome }}
        run: |
          [ "$MALFORMED" = failure ]
          [ "$OTHER" = failure ]

  # The version action against throwaway repositories: each case starts from a v1.2.3 release and adds commits.
  version-rules:
    name: Version rules (${{ matrix.case }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: feat
            subjects: "fix: a fix|feat(ui): a feature"
            expected: 1.3.0 minor
          - case: fix
            subjects: "fix: a fix|chore(deps): an update"
            expected: 1.2.4 patch
          - case: docs and test only
            subjects: "docs: a doc|test: a test"
            expected: 1.2.3 none
          - case: bang
            subjects: "feat(api)!: drop v1"
            expected: 2.0.0 major
          - case: footer
            subjects: "refactor: move it"
            body: "BREAKING CHANGE: it moved"
            expected: 2.0.0 major
          - case: mentioned, not a footer
            subjects: "feat: explain the rules"
            body: "This mentions type!: and BREAKING CHANGE: mid-line."
            expected: 1.3.0 minor
          - case: feat mentioned in a fix
            subjects: "fix: revert the feat: change"
            expected: 1.2.4 patch
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: src

      - name: Create the fixture repository
        env:
          SUBJECTS: ${{ matrix.subjects }}
          BODY: ${{ matrix.body }}
        run: |
          git init -q -b main
          echo src/ >> .git/info/exclude
          git config user.name test
          git config user.email test@example.com
          # semantic-version skips commits that change no files, so each one changes a file.
          change() { echo "$1" >> changes.txt; git add changes.txt; }
          change first
          git commit -q -m "feat: first"
          git tag v1.2.3
          IFS='|' read -ra lines <<<"$SUBJECTS"
          for subject in "${lines[@]}"; do
            change "$subject"
            if [ -n "$BODY" ]; then git commit -q -m "$subject" -m "$BODY"; else git commit -q -m "$subject"; fi
          done
          git log --format='%h %s%n%b'

      - name: Version
        id: version
        uses: ./src/version
        with:
          tag-prefix: v

      - name: Check the version
        env:
          ACTUAL: ${{ steps.version.outputs.version }} ${{ steps.version.outputs.version-type }}
          EXPECTED: ${{ matrix.expected }}
        run: |
          echo "expected $EXPECTED, got $ACTUAL"
          [ "$ACTUAL" = "$EXPECTED" ]

  smoke-test:
    name: Smoke test action
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Pull a test image
        run: docker pull nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de

      - name: Smoke test an answering image
        uses: ./smoke-test
        with:
          image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
          port: "80"
          status: "200"
          env: |
            FOO=bar

      - name: Smoke test a wrong status
        id: wrong
        continue-on-error: true
        uses: ./smoke-test
        with:
          image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
          port: "80"
          path: /missing
          status: "200"

      - name: Check the wrong status failed
        env:
          OUTCOME: ${{ steps.wrong.outcome }}
        run: |
          [ "$OUTCOME" = "failure" ]

  # Runs bun-setup the way a consumer would, against the fixture projects in tests/fixtures.
  bun-setup:
    name: Bun setup action
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Bun from .bun-version
        id: pinned
        uses: ./bun-setup
        with:
          working-directory: tests/fixtures/bun-project

      - name: Check the pinned setup
        working-directory: tests/fixtures/bun-project
        env:
          BUN_VERSION_OUTPUT: ${{ steps.pinned.outputs.bun-version }}
          CACHE_HIT: ${{ steps.pinned.outputs.cache-hit }}
        run: |
          expected=$(head -n 1 .bun-version)
          echo "bun-version=$BUN_VERSION_OUTPUT cache-hit=$CACHE_HIT"
          [ "$BUN_VERSION_OUTPUT" = "$expected" ]
          [ "$(bun --version)" = "$expected" ]
          [[ $CACHE_HIT =~ ^(true|false)$ ]]
          [ -d node_modules/ms ]
          # Lifecycle scripts are skipped by default
          [ ! -e postinstall-ran ]

      - name: Set up Bun with lifecycle scripts enabled
        uses: ./bun-setup
        with:
          working-directory: tests/fixtures/bun-project
          ignore-scripts: "false"

      - name: Check the postinstall script ran
        run: '[ -e tests/fixtures/bun-project/postinstall-ran ]'

      - name: Set up Bun with an explicit version and no install
        id: explicit
        uses: ./bun-setup
        with:
          bun-version: 1.4.2
          install: "false"

      - name: Check the explicit version
        env:
          BUN_VERSION_OUTPUT: ${{ steps.explicit.outputs.bun-version }}
          CACHE_HIT: ${{ steps.explicit.outputs.cache-hit }}
        run: |
          [ "$BUN_VERSION_OUTPUT" = 1.4.2 ]
          [ "$(bun --version)" = 1.4.2 ]
          [ "$CACHE_HIT" = false ]

      - name: Set up an unpinned project
        id: unpinned
        continue-on-error: true
        uses: ./bun-setup
        with:
          working-directory: tests/fixtures/bun-unpinned
          install: "false"

      - name: Check the unpinned project failed
        env:
          OUTCOME: ${{ steps.unpinned.outcome }}
        run: |
          [ "$OUTCOME" = "failure" ]
