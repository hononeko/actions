# Used when the repository has no zizmor config of its own.
rules:
  # Suggests uses: $/path for the repository's own actions and workflows, which actionlint rejects.
  self-repository:
    disable: true
  # hononeko/actions is used by its major tag (v1), which every release moves; everything else stays pinned by hash.
  unpinned-uses:
    config:
      policies:
        hononeko/actions/*: ref-pin
  # Flags a hash pin once the tag in its version comment moves on (# v4 when v4 has a newer commit), which fails
  # unrelated pull requests until Renovate's digest update merges. Renovate keeps pins and their comments in step.
  ref-version-mismatch:
    disable: true
