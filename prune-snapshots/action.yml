name: Prune snapshots
description: >-
  Deletes one pull request's snapshot images from GHCR. Snapshots are tagged with unique snapshot tags
  (pr-<PR> and pr-<PR>-sha-<commit>), and prune-snapshots deletes package versions matching these snapshot
  tags, along with their platform images and attestations. Run it when the pull request closes.

inputs:
  package:
    description: GHCR package (image name without the registry and owner), e.g. my-app
    required: true
  pr-number:
    description: The pull request whose snapshots to delete
    required: true
  owner:
    description: Owner of the package; empty for the repository's owner
    required: false
    default: ""
  token:
    description: 'Token with the `packages: write` permission on the package'
    required: false
    default: ${{ github.token }}
  dry-run:
    description: '"true" to only log what would be deleted'
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Select the snapshot tags
      id: pattern
      shell: bash
      env:
        PR: ${{ inputs.pr-number }}
      run: |
        pattern=$("$GITHUB_ACTION_PATH/snapshot-pattern.sh" "$PR")
        echo "pattern=$pattern" >> "$GITHUB_OUTPUT"
        echo "Deleting tags matching: $pattern"

    # Only delete-tags is set, so nothing else is deleted: the action's default of deleting every untagged image applies
    # only when no delete or keep option is given.
    - name: Prune
      uses: dataaxiom/ghcr-cleanup-action@ac45a8c04b1eb4b27974ca79a0a74f344c93664b # v1.3.0
      with:
        package: ${{ inputs.package }}
        owner: ${{ inputs.owner }}
        token: ${{ inputs.token }}
        use-regex: true
        delete-tags: ${{ steps.pattern.outputs.pattern }}
        validate: true
        dry-run: ${{ inputs.dry-run }}
