name: Bun setup
description: >-
  Installs a pinned Bun version and the project's dependencies exactly as locked in bun.lock, with a dependency
  cache. The version comes from the bun-version input, .bun-version, or package.json's packageManager (bun@X.Y.Z);
  anything but an exact version fails, so builds never float to "latest". Dependency lifecycle scripts are skipped
  unless ignore-scripts is "false".

inputs:
  bun-version:
    description: Exact Bun version, e.g. 1.4.3. Defaults to the project's .bun-version or packageManager.
    required: false
    default: ""
  working-directory:
    description: Directory with the project's package.json and bun.lock
    required: false
    default: "."
  install:
    description: Install the project's dependencies with `bun install --frozen-lockfile`
    required: false
    default: "true"
  ignore-scripts:
    description: >-
      Skip lifecycle scripts (postinstall and the like) during install. Only "false" runs them; do that only for
      dependencies you trust to run code in CI.
    required: false
    default: "true"

outputs:
  bun-version:
    description: The installed Bun version, e.g. 1.4.3
    value: ${{ steps.resolve.outputs.version }}
  cache-hit:
    description: '"true" when the dependency cache matched bun.lock exactly'
    value: ${{ steps.cache.outputs.cache-hit == 'true' }}

runs:
  using: composite
  steps:
    - name: Resolve the Bun version
      id: resolve
      shell: bash
      env:
        BUN_VERSION_INPUT: ${{ inputs.bun-version }}
        PROJECT_DIR: ${{ inputs.working-directory }}
      run: |
        err=$(mktemp)
        if ! version=$("$GITHUB_ACTION_PATH/resolve-version.sh" "$PROJECT_DIR" 2>"$err"); then
          echo "::error title=bun-setup::$(cat "$err")"
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Install Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ steps.resolve.outputs.version }}

    - name: Cache dependencies
      id: cache
      if: inputs.install == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-deps-${{ runner.os }}-${{ runner.arch }}-${{ steps.resolve.outputs.version }}-${{ hashFiles(format('{0}/bun.lock', inputs.working-directory)) }}
        restore-keys: |
          bun-deps-${{ runner.os }}-${{ runner.arch }}-${{ steps.resolve.outputs.version }}-

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        IGNORE_SCRIPTS: ${{ inputs.ignore-scripts }}
      run: |
        args=(--frozen-lockfile)
        # Anything but an explicit "false" keeps lifecycle scripts off
        if [ "$IGNORE_SCRIPTS" != "false" ]; then args+=(--ignore-scripts); fi
        bun install "${args[@]}"
